<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trueque U - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="glass-container">
        <div class="logo-container">
            <img src="logoSinFondo.png" alt="Trueque U Logo" class="logo">
        </div>
        <h2>Login</h2>
        <p class="subtitle">Bienvenido de nuevo. Inicia sesión en tu cuenta</p>
        
        <form id="loginForm">
            <div id="errorMessage" class="error-message"></div>
            
            <div class="input-box">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            
            <div class="input-box">
                <input type="password" id="password" placeholder="Contraseña" required>
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </div>
            
            <button type="submit" class="btn btn-login">Iniciar Sesión</button>
        </form>

        <div class="signup-link">
            <p>¿No tienes una cuenta? <a href="register.html">Regístrate</a></p>
        </div>
    </div>
    <script type="module" src="js/login.js"></script>
</body>
</html>
