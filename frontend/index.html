<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trueque U - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Trueque U</h1>
    <h2>Iniciar Sesión</h2>
    
    <form id="loginForm">
        <div id="errorMessage" class="error-message"></div>
        <p>Correo electrónico:<br> <input type="email" id="email" required></p>
        <p>Contraseña:<br> <input type="password" id="password" required></p>
        <p><button type="submit">Entrar</button></p>
    </form>

    <hr>
    <ul>
        <li><a href="recover.html">¿Olvidaste tu contraseña?</a></li>
        <li>¿No tienes una cuenta? <a href="register.html">Regístrate</a></li>
    </ul>
    
    <script type="module" src="js/login.js"></script>
</body>
</html>
