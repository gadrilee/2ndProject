<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trueque U - Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Trueque U</h1>
    <h2>Registro</h2>
    
    <form id="registerForm">
        <div id="errorMessage" class="error-message"></div>
        <p>Nombre completo:<br> <input type="text" id="name" required></p>
        <p>Correo electrónico:<br> <input type="email" id="email" required></p>
        <p>Contraseña:<br> <input type="password" id="password" required></p>
        <p><button type="submit">Crear cuenta</button></p>
    </form>
    
    <hr>
    <p>¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a></p>

    <script type="module" src="js/register.js"></script>
</body>
</html>
